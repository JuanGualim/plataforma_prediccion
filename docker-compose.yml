# Servicios de infraestructura local.
# Fase 1: PostgreSQL. Fase 3: MLflow (tracking + registry) y SeaweedFS (artefactos, API S3).
# El servicio de serving se agrega en la fase 4.
services:
  postgres:
    image: postgres:16-alpine
    container_name: mlplatform-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-support}
      POSTGRES_USER: ${POSTGRES_USER:-mlplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlplatform_local}
    ports:
      # Solo expuesto en localhost, no en todas las interfaces de red.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Los scripts de init solo se ejecutan cuando el volumen está vacío.
      # Para re-ejecutarlos: `make db-reset`.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Almacenamiento de artefactos compatible con S3 (modelos, reportes, model cards).
  # SeaweedFS reemplaza a MinIO, que dejó de publicar imágenes libres (ver ADR 0006).
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: mlplatform-seaweedfs
    command: ["mini", "-dir=/data", "-bucket=mlflow", "-ip=seaweedfs"]
    environment:
      AWS_ACCESS_KEY_ID: ${ARTIFACTS_ACCESS_KEY:-mlplatform}
      AWS_SECRET_ACCESS_KEY: ${ARTIFACTS_SECRET_KEY:-mlplatform_local_secret}
    volumes:
      - seaweedfs_data:/data
    # Sin puertos publicados: solo MLflow habla con el almacenamiento.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mlflow:
    build: ./infra/mlflow
    image: mlplatform-mlflow:3.17.0
    container_name: mlplatform-mlflow
    command: ["python", "/opt/mlflow/bootstrap.py"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-support}
      POSTGRES_USER: ${POSTGRES_USER:-mlplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlplatform_local}
      MLFLOW_S3_ENDPOINT_URL: http://seaweedfs:8333
      AWS_ACCESS_KEY_ID: ${ARTIFACTS_ACCESS_KEY:-mlplatform}
      AWS_SECRET_ACCESS_KEY: ${ARTIFACTS_SECRET_KEY:-mlplatform_local_secret}
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      # La imagen de MLflow no trae curl ni wget; se usa Python.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 30
      # El primer arranque crea las tablas de MLflow (migraciones) y tarda más.
      start_period: 90s
    restart: unless-stopped

volumes:
  postgres_data:
  seaweedfs_data:
