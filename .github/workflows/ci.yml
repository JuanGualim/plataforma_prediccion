# Integración continua: lint + pruebas unitarias + integración con Postgres, MLflow y SeaweedFS.
# Estado: Diseñado. Se ejecutará cuando el repositorio se publique en GitHub.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: cp .env.example .env
      - run: uv sync --locked
      - run: docker compose up -d --build --wait
      - run: make lint
      - run: make test
      - run: make test-integration
